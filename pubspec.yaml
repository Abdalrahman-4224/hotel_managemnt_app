name: hotel_managemnt_app
description: "فندقي بلس: إدارة الفندق من الهاتف - الحجوزات والغرف والمهام والمخزن والمالية."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  dio: ^5.11.1
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^23.0.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.1
  google_fonts: ^9.0.0
  intl: ^0.20.3
  local_auth: ^3.0.2
  local_auth_android: ^2.3.0
  local_auth_darwin: ^2.0.5
  lucide_icons_flutter: ^4.0.0
  riverpod: ^3.4.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  # The three type families, bundled so the app never downloads them (see
  # main.dart). File names follow google_fonts: <Family>-<Weight>.ttf.
  assets:
    - assets/fonts/

# The launcher icon: the approved Funduqi Plus icon, copied unchanged from the
# brand package (funduqi-plus-icons.zip). Never redraw or re-rasterise it.
#   AppIcon-1024.png      ios/AppIcon-1024.png (square, RGB, no alpha)
#   foreground-1024.png   android/adaptive-layers/foreground-1024.png
#   monochrome-1024.png   android/adaptive-layers/monochrome-1024.png
#   play-store-512.png    android/play-store-512.png (Play Console only)
# The foreground layer is already drawn inside Android's safe zone, so the
# generator must not inset it again (its default is 16%).
# After changing anything here run:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/AppIcon-1024.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#1d1a16"
  adaptive_icon_foreground: "assets/icon/foreground-1024.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/icon/monochrome-1024.png"
