name: hotel_managemnt_app
description: "فندقي بلس: إدارة الفندق من الهاتف - الحجوزات والغرف والمهام والمخزن والمالية."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  dio: ^5.11.1
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^23.0.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  google_fonts: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  local_auth: ^3.0.2
  local_auth_android: ^2.3.0
  lucide_icons_flutter: ^4.0.0
  riverpod: ^3.4.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# The launcher icon. The source of truth is assets/icon/icon.svg - the same
# gold hotel mark the website uses as its favicon. Three variants are derived
# from it by hand because the corners and the padding differ per platform:
#   _square.svg       the mark on a full, square plate (no rounded corners):
#                     the source for iOS, which rounds them itself and rejects
#                     an alpha channel outright.
#   _adaptive-bg.svg  the plate alone, Android's adaptive background layer.
#   _adaptive-fg.svg  the mark alone on nothing, Android's foreground layer.
#                     It is drawn larger than in icon.svg because the generator
#                     insets this layer by 16%, and the mark has to end up at
#                     about half the finished icon to match Android's own.
# Re-rasterise the PNGs from those (any SVG rasteriser) and then run:
#   dart run flutter_launcher_icons
# which overwrites every mipmap-*/ic_launcher.png and the whole iOS AppIcon set.
# assets/icon/play-store-512.png is the Play Console listing icon; it is not
# used by the app, and Play rounds its corners itself.
flutter_launcher_icons:
  android: true
  ios: true
  # The flat, full icon. iOS rejects an icon with an alpha channel, and this is
  # also the fallback on Android phones older than 8.0, which have no adaptive
  # icons to compose.
  image_path: "assets/icon/icon-1024.png"
  remove_alpha_ios: true
  # Android composes these two layers itself: the plate, and the mark alone on
  # a transparent canvas. Neither is a complete icon on its own.
  adaptive_icon_background: "assets/icon/adaptive-layers/background.png"
  adaptive_icon_foreground: "assets/icon/adaptive-layers/foreground.png"
